<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bastion.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <input id="chat" maxlength="120" autocomplete="off" placeholder="Nachricht an Spieler in der Nähe · /t … = Team" data-i18n-ph>

  <!-- Hauptmenü: nächtliche Lichtung aus den Spielgrafiken, davor Titelschild und Login-Brett (Werkbank-Stil wie das HUD) -->
  <div id="menu">
    <div class="scene" aria-hidden="true">
      <div class="glow"></div>
      <img class="deco tree t1" src="assets/world/trees/tree.svg" alt="">
      <img class="deco tree t2" src="assets/world/trees/tree.svg" alt="">
      <img class="deco tree t3" src="assets/world/trees/apple_tree.svg" alt="">
      <img class="deco tree t4" src="assets/world/trees/tree.svg" alt="">
      <img class="deco tree t5" src="assets/world/trees/tree.svg" alt="">
      <img class="deco rock r1" src="assets/world/rocks/rock.svg" alt="">
      <img class="deco rock r2" src="assets/world/rocks/gold.svg" alt="">
      <img class="deco rock r3" src="assets/world/rocks/copper.svg" alt="">
      <img class="deco bush b1" src="assets/world/plants/berry_bush.svg" alt="">
      <img class="deco fire" src="assets/structures/campfire.svg" alt="">
    </div>

    <div class="board">
      <div class="sign">
        <h1>Bastion<span>.io</span></h1>
        <p class="tagline" data-i18n>Sammeln · Bauen · Schmieden · Überleben</p>
      </div>

      <!-- Sprachauswahl: Knöpfe kommen aus js/i18n.js (LANGS), menu.js füllt sie -->
      <div class="langs" id="langs" role="group" aria-label="Sprache · Language · Język"></div>

      <div class="plank">
        <div class="parchment">
          <label for="name" data-i18n>Name</label>
          <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="username" data-i18n-ph>
          <label for="pass" data-i18n-html>Passwort <small>(nur für einen Account)</small></label>
          <input id="pass" type="password" maxlength="64" placeholder="••••••" autocomplete="current-password">
          <div class="auth-buttons">
            <button id="play" data-i18n>Einloggen</button>
            <button id="register" class="secondary" data-i18n>Registrieren</button>
          </div>
          <p id="menu-info"></p>
        </div>
        <button id="guest" class="guest" data-i18n-html>Als Gast spielen <small>· wird nicht gespeichert</small></button>
      </div>

      <ul class="features">
        <li><img src="assets/items/materials/wood.svg" alt=""><span data-i18n>Rohstoffe sammeln</span></li>
        <li><img src="assets/ui/base.svg" alt=""><span data-i18n>Basis bauen</span></li>
        <li><img src="assets/items/materials/bronze.svg" alt=""><span data-i18n>Schmieden</span></li>
        <li><img src="assets/ui/hourglass.svg" alt=""><span data-i18n>Nächte überleben</span></li>
      </ul>
      <p class="hint" data-i18n-html>Steuerung &amp; Hilfe im Spiel: <kbd>Esc</kbd></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
